async function wireMoney(){
  const t=state.trip,key='budget:'+t.id,code=((t.practical||{}).currencyCode||'EUR').toUpperCase();
  const saved=await store.get(key); let rows=Array.isArray(saved)?saved:((saved&&saved.rows)||[]);
  let rate=null;
  const toILS=x=>x.cur==='ILS'?x.amount:(rate?x.amount/rate:null);
  const persist=()=>store.set(key,{rows});
  $('#ewho').value=localGet('me:'+t.id)||'';
  const paint=()=>{
    const tot=rows.reduce((s,x)=>s+(toILS(x)||0),0);
    $('#etable').innerHTML=rows.length?`<table><thead><tr><th>קטגוריה</th><th>תיאור</th><th>יום</th><th>מי</th><th>סכום</th><th></th></tr></thead>
      <tbody>${rows.map((x,i)=>`<tr><td>${esc(x.cat)}</td><td>${esc(x.desc||'')}</td><td>${x.day?'יום '+x.day:'—'}</td>
        <td>${esc(x.who||'')}</td><td>${x.amount} ${esc(x.cur)}</td><td><button class="btn btn-plain btn-sm" data-del="${i}">מחיקה</button></td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">סה"כ</td><td colspan="2">${tot?tot.toFixed(0)+' ₪':'—'}${rate&&tot?` · ${(tot*rate).toFixed(0)} ${code}`:''}</td></tr></tfoot></table>`
      :'<p class="hint" style="margin:0">עוד לא הוזנו הוצאות.</p>';
    const byCat={}; rows.forEach(x=>{ byCat[x.cat]=(byCat[x.cat]||0)+(toILS(x)||0); });
    const max=Math.max(1,...Object.values(byCat));
    $('#ebars').innerHTML=Object.entries(byCat).map(([c,v])=>`<div class="catbar">
      <div class="lbl"><span>${esc(c)}</span><span>${v.toFixed(0)} ₪</span></div>
      <div class="track"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join('');
    $$('[data-del]').forEach(b=>b.onclick=async()=>{ rows.splice(+b.dataset.del,1); await persist(); paint(); });
  };
  $('#eadd').onclick=async()=>{ const amt=+$('#eamt').value; if(!amt)return;
    rows.push({cat:$('#ecat').value,desc:$('#edesc').value,amount:amt,cur:$('#ecur').value,day:$('#eday').value,who:$('#ewho').value,ts:Date.now()});
    localSet('me:'+t.id,$('#ewho').value); await persist(); $('#eamt').value=''; $('#edesc').value=''; paint(); };
  paint();
  fetchRate('ILS',code).then(r=>{ if(r&&document.body.contains($('#etable')||document.body)){ rate=r.rate; paint(); } }).catch(()=>{});
}

const NF={
  clientId: window.__NETLIFY_CLIENT_ID__||'',
  token: localGet('nf:token')||'',
  get on(){ return !!this.token; },
  async api(path,opts={}){
    const o=Object.assign({},opts);
    o.headers=Object.assign({Authorization:'Bearer '+this.token},opts.headers||{});
    const r=await fetch('https://api.netlify.com/api/v1/'+path,o);
    if(r.status===401){ this.token=''; localDel('nf:token'); throw new Error('ההרשאה פגה. התחברו מחדש.'); }
    if(!r.ok){ let m=''; try{ m=(await r.json()).message||''; }catch(e){}
      throw new Error(m||('שגיאה '+r.status)); }
    const t=await r.text(); return t?JSON.parse(t):null;
  },
  login(){
    if(!this.clientId) throw new Error('התחברות מהירה לא הוגדרה. השתמשו במפתח אישי.');
    const redirect=location.origin+location.pathname;
    const url=`https://app.netlify.com/authorize?client_id=${encodeURIComponent(this.clientId)}&response_type=token&redirect_uri=${encodeURIComponent(redirect)}`;
    const w=window.open(url,'netlify-auth','width=620,height=760');
    return new Promise((res,rej)=>{
      const onMsg=e=>{ if(e.origin!==location.origin||!e.data||!e.data.netlifyToken) return;
        window.removeEventListener('message',onMsg); clearInterval(iv);
        this.token=e.data.netlifyToken; localSet('nf:token',this.token); res(); };
      window.addEventListener('message',onMsg);
      const iv=setInterval(()=>{ if(w&&w.closed){ clearInterval(iv); window.removeEventListener('message',onMsg);
        rej(new Error('החלון נסגר לפני האישור.')); } },700); });
  },
  async sites(){ return await this.api('sites?filter=all&per_page=60')||[]; },
  async publish(html,{siteId,name},onStep=()=>{}){
    let site;
    if(siteId){ onStep('מאתר'); site=await this.api('sites/'+siteId); }
    else { onStep('יוצר אתר'); site=await this.api('sites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(name?{name}:{})}); }
    const bytes=new TextEncoder().encode(html), digest=await sha1hex(bytes);
    onStep('מכין');
    const dep=await this.api(`sites/${site.id}/deploys`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({files:{'/index.html':digest},async:false})});
    if((dep.required||[]).includes(digest)){ onStep('מעלה');
      const up=await fetch(`https://api.netlify.com/api/v1/deploys/${dep.id}/files/index.html`,
        {method:'PUT',headers:{Authorization:'Bearer '+this.token,'Content-Type':'application/octet-stream'},body:bytes});
      if(!up.ok) throw new Error('העלאת הקובץ נכשלה'); }
    onStep('מפרסם');
    for(let i=0;i<20;i++){ const d=await this.api('deploys/'+dep.id);
      if(d.state==='ready') return {site,url:site.ssl_url||site.url};
      if(d.state==='error') throw new Error('הפריסה נכשלה.');
      await wait(1500); }
    return {site,url:site.ssl_url||site.url};
  }
};
async function sha1hex(bytes){ const b=await crypto.subtle.digest('SHA-1',bytes);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function shareLink(t){
  t=t||state.trip; if(!t) return '';
  if(GUEST) return location.href.split('#')[0];
  if(SB.on) return location.origin+location.pathname+'?trip='+encodeURIComponent(t.id);
  return t.publicUrl||'';
}

-- ========== גישה מבוקרת ==========
create or replace function public.trip_get(p_trip text, p_key text)
returns jsonb language sql security definer set search_path=public as $$
  select value from public.trip_shared_data where trip_id=p_trip and data_key=p_key;
$$;

create or replace function public.trip_set(p_trip text, p_key text, p_value jsonb)
returns void language sql security definer set search_path=public as $$
  insert into public.trip_shared_data (trip_id,data_key,value,updated_at)
  values (p_trip,p_key,p_value,now())
  on conflict (trip_id,data_key) do update set value=excluded.value, updated_at=now();
$$;

create or replace function public.story_list(p_trip text, p_day text)
returns setof public.trip_stories language sql security definer set search_path=public as $$
  select * from public.trip_stories
  where trip_id=p_trip and (p_day is null or p_day='' or day_key=p_day)
  order by visit_date asc;
$$;

create or replace function public.story_add(
  p_trip text, p_day text, p_day_title text, p_author text,
  p_place text, p_images jsonb, p_paths jsonb)
returns public.trip_stories language plpgsql security definer set search_path=public as $$
declare r public.trip_stories;
begin
  if (select count(*) from public.trip_stories where trip_id=p_trip) > 400 then
    raise exception 'too many stories for this trip';
  end if;
  insert into public.trip_stories (trip_id,day_key,day_title,author,location_name,images,image_paths,visit_date)
  values (p_trip,p_day,coalesce(p_day_title,''),coalesce(p_author,''),coalesce(p_place,''),
          coalesce(p_images,'[]'::jsonb),coalesce(p_paths,'[]'::jsonb),now())
  returning * into r;
  return r;
end $$;

create or replace function public.story_del(p_trip text, p_id uuid)
returns void language sql security definer set search_path=public as $$
  delete from public.trip_stories where id=p_id and trip_id=p_trip;
$$;

create or replace function public.photo_count(p_trip text)
returns integer language sql security definer set search_path=public as $$
  select coalesce(sum(jsonb_array_length(images)),0)::int
  from public.trip_stories where trip_id=p_trip;
$$;

grant execute on function public.trip_get(text,text), public.trip_set(text,text,jsonb),
  public.story_list(text,text), public.story_add(text,text,text,text,text,jsonb,jsonb),
  public.story_del(text,uuid), public.photo_count(text) to anon, authenticated;

    app.innerHTML=`<div class="wrap narrow"><div class="stage center">
      <div class="bar" style="max-width:220px;margin:0 auto"><i style="width:55%"></i></div>
      <p class="sub" style="margin-top:18px">טוען את הטיול…</p></div></div>`;
    let t=null;
    if(SB.on){ try{ t=await SB.getTrip(TRIP_PARAM); }catch(e){} }
    if(t){ state.trip=t; state.day=todayIndex(t)||1; renderSite(); return; }
    app.innerHTML=`<div class="wrap narrow"><div class="stage center">
      <h2>הטיול לא נמצא</h2>
      <p class="sub">ייתכן שהקישור שגוי, או שהטיול נמחק.</p>
      <div><button class="btn btn-primary" id="tohome">בניית טיול חדש</button></div></div></div>`;
    const b=$('#tohome'); if(b) b.onclick=()=>{ location.href=location.pathname; };
    return;
  }
  if(EMBEDDED){
    state.trip=window.__EMBEDDED_TRIP__;
    if(SB.on){ try{ const fresh=await SB.getTrip(state.trip.id); if(fresh) state.trip=fresh; }catch(e){} }
    state.day=todayIndex(state.trip)||1; renderSite(); return; }
  renderHome();
})();

</script>
</body>
</html>
