<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FE5B25">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>מסלול · בונה אתרי טיול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@300;400;600;700&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* לוח צבעים: חם ואישי — בז' עמוק, כתום חי, כחול-לילה */
  --ink:#1A2030; --ink-2:#3D444E; --muted:#7A7060;
  --paper:#FDFAF5; --wash:#F2E8D5; --line:#DDD0B8;
  --accent:#E8773A; --accent-ink:#B85520; --accent-soft:#FAEADE;
  --night:#1A2F3A; --night-2:#1E3A4A;
  --ok:#1F7A4C; --warn:#B4530C;
  --sh-1:0 1px 2px rgba(20,22,26,.05), 0 8px 24px -12px rgba(20,22,26,.12);
  --sh-2:0 2px 4px rgba(20,22,26,.06), 0 24px 48px -20px rgba(20,22,26,.22);
  --r-s:12px; --r:18px; --r-l:26px;
  --display:'Secular One', 'Heebo', system-ui, sans-serif;
  --body:'Assistant', system-ui, -apple-system, sans-serif;
  --util:'Heebo', system-ui, sans-serif;
  --pad:clamp(18px,4vw,28px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--wash);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.12;margin:0;letter-spacing:-.01em}
p{margin:0 0 1em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{-webkit-appearance:none;cursor:pointer}
a{color:var(--accent-ink);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.narrow{max-width:660px}
.center{text-align:center}
.eyebrow{font-family:var(--util);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:9px}
.eyebrow:before{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px;flex:0 0 auto}
.center .eyebrow{justify-content:center}
.hint{font-size:14px;color:var(--muted);line-height:1.6}

/* ---------- כפתורים ---------- */
.btn{border:0;border-radius:999px;padding:14px 30px;font-weight:700;font-size:16px;transition:transform .15s,box-shadow .15s,background .15s;
  font-family:var(--body);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 10px 22px -10px rgba(254,91,37,.75)}
.btn-primary:hover{background:var(--accent-ink);transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(254,91,37,.8)}
.btn-primary:active{transform:translateY(0)}
.btn-ghost{background:var(--paper);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink);transform:translateY(-1px)}
.btn-plain{background:none;color:var(--muted);padding:11px 14px}
.btn-plain:hover{color:var(--ink)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{padding:9px 18px;font-size:14.5px}
.btn-lg{padding:18px 42px;font-size:18px}
.btn-block{width:100%}

/* ---------- שדות ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-family:var(--util);font-weight:700;font-size:12.5px;letter-spacing:.03em;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-s);
  padding:13px 15px;width:100%;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 18px;font-size:15px;
  user-select:none;transition:.15s;font-weight:600}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:16px;
  box-shadow:var(--sh-1)}
.box h4{font-size:19px;margin-bottom:12px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.kv{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border:0;padding-bottom:0}
.kv b{font-family:var(--util);font-weight:700;color:var(--ink-2);white-space:nowrap}
ul.clean{margin:0;padding-inline-start:20px}ul.clean li{margin-bottom:6px}
code{background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13.5px;
  direction:ltr;display:inline-block;font-family:var(--util)}
.err-box{background:#FFF3EF;border:1px solid #F3C4B4;color:#8E2F0E;border-radius:var(--r-s);padding:14px 16px;margin:12px 0;font-size:15px}
.ok-box{background:#EEF8F2;border:1px solid #B9E0CA;color:#14603A;border-radius:var(--r-s);padding:14px 16px;margin:12px 0;font-size:15px}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--util);font-size:13px;font-weight:700;
  border-radius:999px;padding:7px 15px;border:1.5px solid var(--line);background:var(--paper)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok{color:var(--ok);border-color:#B9E0CA;background:#EEF8F2}.status.ok i{background:var(--ok)}
.status.bad{color:var(--warn);border-color:#F3C4B4;background:#FFF3EF}.status.bad i{background:var(--warn)}

/* ---------- פס עליון ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:13px;padding-bottom:13px}
.brand{font-family:var(--display);font-size:20px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.brand span{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;
  color:#fff;font-size:15px;box-shadow:0 6px 14px -6px rgba(254,91,37,.9)}
.iconbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;width:42px;height:42px;
  font-size:17px;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--ink);transform:translateY(-1px)}
.iconbtn svg{width:19px;height:19px;display:block}
.pill-ico{display:inline-flex;align-items:center;gap:7px}
.pill-ico svg{width:15px;height:15px;stroke-width:1.8}
.ico-inline{width:46px;height:46px;border-radius:14px;background:var(--wash);color:var(--ink-2);
  display:grid;place-items:center;float:inline-start;margin-inline-end:16px}
.ico-inline svg{width:24px;height:24px}
.opt:hover .ico-inline{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- אשף ---------- */
.stage{min-height:70vh;display:flex;flex-direction:column;justify-content:center;padding:36px 0 70px;
  animation:rise .4s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stage h2{font-size:clamp(30px,6vw,50px)}
.stage .sub{color:var(--muted);font-size:17.5px;margin:12px 0 30px;max-width:52ch}
.center .sub{margin-inline:auto}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:.3s}
.dots i.on{background:var(--accent);width:26px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));align-items:stretch}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r);padding:24px 16px 22px;
  text-align:center;transition:.16s cubic-bezier(.2,.7,.3,1);font-family:inherit;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;justify-content:flex-start}
.opt:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:var(--sh-2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(254,91,37,.18)}
.opt .ico{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:15px;
  background:var(--wash);color:var(--ink-2);transition:.18s}
.opt .ico svg{width:28px;height:28px;display:block}
.opt:hover .ico{background:var(--ink);color:#fff}
.opt.on .ico{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px rgba(254,91,37,.85)}
.chip .ci{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  margin-inline-end:8px;vertical-align:-4px;color:var(--muted);transition:color .15s}
.chip .ci svg{width:19px;height:19px;stroke-width:1.7}
.chip:hover .ci{color:var(--ink)}
.chip.on .ci{color:#fff}
.opt b{display:block;font-family:var(--util);font-size:16px;font-weight:700}
.opt small{color:var(--muted);font-size:13px;display:block;margin-top:3px}
.bigin{width:100%;border:0;border-bottom:2.5px solid var(--line);background:transparent;font-family:var(--display);
  font-size:clamp(26px,5.4vw,40px);padding:12px 4px;text-align:center;transition:border-color .2s}
.bigin::placeholder{color:#C9C4BC}
.bigin:focus{outline:none;border-color:var(--accent)}
.navrow{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:34px}
.stepper{display:flex;align-items:center;gap:20px;justify-content:center}
.stepper button{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);
  font-size:24px;color:var(--ink);transition:.15s}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.stepper .val{font-family:var(--util);font-weight:900;font-size:52px;min-width:88px;text-align:center;letter-spacing:-.03em}

/* ---------- מגירה ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(14,27,43,.5);backdrop-filter:blur(3px)}
.sheet .panel-in{position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(580px,100%);background:var(--wash);
  box-shadow:var(--sh-2);overflow:auto;padding-bottom:40px;animation:slide .3s cubic-bezier(.2,.7,.3,1)}
@keyframes slide{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.sheet header{position:sticky;top:0;background:var(--wash);border-bottom:1px solid var(--line);
  padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.sheet header h3{font-size:21px}
.sheet .body{padding:20px}
.setup .step{display:flex;gap:15px;padding:18px 0;border-top:1px solid var(--line)}
.setup .step:first-child{border-top:0;padding-top:4px}
.setup .step>div{flex:1;min-width:0}
.setup .step b{font-family:var(--util);font-size:16px}
.setup .step p{margin:5px 0 0}
.num{flex:0 0 32px;height:32px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;
  font-family:var(--util);font-weight:900;font-size:14px}
details.help{border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper);padding:15px 18px;margin-top:14px}
details.help summary{font-family:var(--util);font-weight:700;font-size:15px}
details.help[open] summary{margin-bottom:8px}

/* ---------- מסך בנייה ---------- */
.progress{max-width:680px;margin:56px auto 90px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-l);padding:34px;box-shadow:var(--sh-2)}
.bar{height:8px;background:var(--wash);border-radius:99px;overflow:hidden;margin:20px 0}
.bar i{display:block;height:100%;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.steps{list-style:none;margin:0;padding:0;font-size:15px;max-height:330px;overflow:auto}
.steps li{display:flex;gap:11px;align-items:center;padding:6px 0;color:var(--muted)}
.steps li.done{color:var(--ink)}.steps li.err{color:var(--warn)}
.dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.steps li.done .dot{background:var(--accent);border-color:var(--accent)}
.steps li.err .dot{background:var(--warn);border-color:var(--warn)}
.steps li.run .dot{border-color:var(--accent);border-left-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- כותרת אתר הטיול ---------- */
.site-hero{background:var(--night);color:#fff;padding:90px 0 72px;position:relative;overflow:hidden;min-height:380px;display:flex;align-items:center}
.site-hero.has-cover{min-height:480px;padding:110px 0 90px}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;
  transition:opacity 1.2s;transform:scale(1.03)}
.hero-photo.loaded{opacity:.5}
.site-hero.has-cover .hero-photo.loaded{opacity:.65}
.site-hero:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(160deg,rgba(14,27,43,.85) 0%,rgba(14,27,43,.6) 50%,rgba(14,27,43,.92) 100%)}
.site-hero.has-cover:before{background:linear-gradient(160deg,rgba(14,27,43,.78) 0%,rgba(14,27,43,.45) 50%,rgba(14,27,43,.88) 100%)}
.site-hero .wrap{position:relative;z-index:2;width:100%}
.site-hero h1{font-size:clamp(38px,7.5vw,72px);color:#fff;max-width:18ch;line-height:1.05;
  text-shadow:0 2px 20px rgba(0,0,0,.3)}
.site-hero .eyebrow{color:#FFB394}
.site-hero .eyebrow:before{background:var(--accent)}
.tagline{font-size:clamp(17px,2.4vw,21px);color:rgba(255,255,255,.85);margin:18px 0 0;max-width:50ch;font-weight:300;line-height:1.55}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;
  padding:8px 18px;font-size:13.5px;font-family:var(--util);font-weight:700;color:rgba(255,255,255,.95);
  backdrop-filter:blur(8px)}

/* ---------- ניווט לשוניות ---------- */
nav.tabs{position:sticky;top:0;z-index:40;background:rgba(246,244,241,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:8px}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--muted);white-space:nowrap;
  border-radius:999px;transition:.15s;font-size:15px}
.tab:hover{color:var(--ink);background:rgba(20,22,26,.05)}
.tab.on{color:#fff;background:var(--ink)}
.panel{display:none;padding:44px 0 90px;animation:fade .35s}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel h2{font-size:clamp(26px,4.4vw,38px);margin-bottom:10px}
.lead{color:var(--muted);margin:0 0 30px;font-size:17px;max-width:58ch}

/* ---------- עכשיו ---------- */
.now-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-2);
  overflow:hidden;margin-bottom:18px}
.now-top{background:var(--ink);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
.now-top h3{color:#fff;font-size:22px}
.clock{font-family:var(--util);font-weight:900;font-size:28px;letter-spacing:-.02em;color:var(--accent)}
.now-body{padding:26px}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--util);font-size:11.5px;font-weight:900;
  letter-spacing:.14em;color:var(--accent)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.85)}}
.nowseg{border-inline-start:3px solid var(--accent);padding:2px 18px;margin:14px 0 6px}
.nowseg h4{font-size:24px;margin:4px 0}
.nextlist{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.nextrow{display:flex;gap:14px;padding:8px 0;font-size:15px;color:var(--muted);align-items:baseline}
.nextrow b{font-family:var(--util);color:var(--ink);flex:0 0 54px;font-weight:900}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-top:24px}
.qbtn{background:var(--wash);border:1px solid var(--line);border-radius:var(--r-s);padding:16px;text-align:start;transition:.15s}
.qbtn:hover{border-color:var(--accent);background:var(--paper);transform:translateY(-2px);box-shadow:var(--sh-1)}
.qbtn b{display:block;font-family:var(--util);font-size:15px;margin-bottom:2px}
.qbtn span{font-size:13px;color:var(--muted)}

/* ---------- כרטיסי ימים ---------- */
.day-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);
  margin-bottom:16px;display:flex;width:100%;padding:0;text-align:start;font-family:inherit;overflow:hidden;
  transition:.2s cubic-bezier(.2,.7,.3,1)}
.day-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px -8px rgba(20,22,26,.18),var(--sh-1);border-color:#C8C2BA}
.day-card.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(254,91,37,.2),var(--sh-1)}
.thumb{flex:0 0 128px;background:var(--night-2) center/cover no-repeat;position:relative}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,27,43,.25),transparent)}
.thumb.nophoto{background:linear-gradient(150deg,var(--night-2),var(--night))}
.stamp{flex:0 0 74px;background:var(--wash);display:grid;place-content:center;text-align:center;
  border-inline-end:1px solid var(--line);padding:16px 6px}
.stamp b{display:block;font-family:var(--util);font-size:30px;font-weight:900;line-height:1;letter-spacing:-.04em}
.stamp span{font-size:11px;color:var(--muted);font-family:var(--util);font-weight:700}
.day-card .body{padding:20px 22px;flex:1;min-width:0}
.day-card h3{font-size:21px;margin-bottom:5px}
.day-card p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{background:var(--wash);border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:12px;
  font-family:var(--util);font-weight:700;color:var(--ink-2)}
.dayselect{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:26px;scrollbar-width:none}
.dayselect::-webkit-scrollbar{display:none}
.dsbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-s);padding:10px 18px;
  white-space:nowrap;font-family:var(--util);font-weight:700;color:var(--muted);transition:.15s;font-size:14.5px}
.dsbtn:hover{border-color:var(--ink);color:var(--ink)}
.dsbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- ציר הזמן — האלמנט המרכזי ---------- */
.timeline{margin-top:12px;display:flex;flex-direction:column;gap:16px}
.slot{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;
  position:relative;box-shadow:var(--sh-1)}
.slot:not(.depart){border-inline-start:4px solid var(--accent)}
.slot.depart{border-inline-start:4px solid var(--line);opacity:.85}
.slot-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.slot-num{font-family:var(--util);font-weight:900;font-size:13px;letter-spacing:.08em;
  background:var(--accent);color:#fff;border-radius:999px;padding:4px 11px;white-space:nowrap;flex-shrink:0}
.slot.depart .slot-num{background:var(--line);color:var(--ink-2)}
.slot .time{font-family:var(--util);font-weight:900;font-size:20px;letter-spacing:-.02em;color:var(--accent)}
.slot.depart .time{color:var(--muted)}
.slot .time small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:0}
.slot h4{font-size:20px;margin:0 0 6px}
.slot p{margin:0 0 10px;color:var(--ink-2)}
.slot .tip{background:var(--accent-soft);border-radius:var(--r-s);padding:11px 15px;font-size:15px;color:var(--accent-ink)}
.travel{font-size:13.5px;color:var(--muted);font-family:var(--util);font-weight:700;margin-top:12px;
  display:inline-flex;align-items:center;gap:7px;background:var(--wash);border-radius:999px;padding:6px 14px}
.navlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.navlink{font-family:var(--util);font-size:13px;font-weight:700;text-decoration:none;border:1.5px solid var(--line);
  border-radius:999px;padding:7px 15px;color:var(--ink);background:var(--paper);transition:.15s}
.navlink:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- גלריה ---------- */
.gal{display:grid;gap:18px;grid-template-columns:repeat(2,1fr)}
.galcard{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;aspect-ratio:16/10;
  background:var(--night-2);box-shadow:var(--sh-1);font-family:inherit;transition:.22s}
.galcard:hover{transform:translateY(-5px);box-shadow:0 16px 40px -10px rgba(20,22,26,.25)}
.galcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s,transform .5s}
.galcard img.loaded{opacity:1}
.galcard:hover img{transform:scale(1.06)}
.galcard .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,27,43,.9),rgba(14,27,43,.05) 62%)}
.galcard .txt{position:absolute;inset-inline:0;bottom:0;padding:18px;text-align:start;color:#fff}
.galcard h3{font-size:21px;color:#fff}
.galcard p{margin:3px 0 0;font-size:13.5px;color:rgba(255,255,255,.78)}
.modal{position:fixed;inset:0;z-index:120;background:rgba(14,27,43,.88);display:grid;place-items:center;padding:20px}
.modal .inner{background:var(--paper);border-radius:var(--r-l);overflow:hidden;max-width:780px;width:100%;box-shadow:var(--sh-2)}
.modal img{width:100%;max-height:62vh;object-fit:cover;display:block;background:var(--wash)}
.modal .cap{padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}

/* ---------- Story Line / יומן ---------- */
.sl-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sl-sync{font-family:var(--util);font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;margin-top:4px}
.sl-sync.cloud{border-color:#B9E0CA;background:#EEF8F2;color:var(--ok)}
.sl-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sl-tabs{display:flex;background:var(--wash);border-radius:999px;padding:4px;gap:0;border:1px solid var(--line)}
.sl-tab{border:0;background:transparent;border-radius:999px;padding:9px 20px;font-family:var(--util);font-size:14px;
  font-weight:700;color:var(--muted);cursor:pointer;transition:.2s;white-space:nowrap}
.sl-tab.on{background:var(--paper);color:var(--ink);box-shadow:var(--sh-1)}
.sl-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sl-search{border:1.5px solid var(--line);border-radius:999px;padding:9px 18px;background:var(--paper);
  font-size:14px;font-family:var(--body);width:150px;transition:.15s}
.sl-search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sl-addrow{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;
  margin-bottom:20px;display:none;gap:12px;flex-wrap:wrap;align-items:flex-end;box-shadow:var(--sh-1)}
.sl-addrow.open{display:flex}
.sl-content{display:flex;flex-direction:column;gap:20px}
.sl-group{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-1)}
.sl-group-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--wash)}
.sl-group-head h3{font-size:17px;margin:0 0 2px}
.sl-group-meta{font-size:12.5px;color:var(--muted);font-family:var(--util)}
.sl-loc-icon{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;
  font-size:18px;flex-shrink:0;border:2px solid var(--line)}
.sl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;background:var(--line)}
.sl-photo{position:relative;overflow:hidden;aspect-ratio:1;background:var(--wash);cursor:pointer}
.sl-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.sl-photo:hover img{transform:scale(1.06)}
.sl-photo .rm{position:absolute;top:7px;inset-inline-end:7px;border:0;background:rgba(14,27,43,.72);color:#fff;
  border-radius:50%;width:26px;height:26px;backdrop-filter:blur(4px);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.sl-photo:hover .rm{opacity:1}
.sl-entry-meta{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap}
.sl-badge{font-family:var(--util);font-size:12px;font-weight:700;background:var(--accent);color:#fff;
  border-radius:999px;padding:3px 12px}
.sl-entry-date{font-size:12.5px;color:var(--muted);font-family:var(--util);margin-inline-start:auto}
.sl-empty{text-align:center;padding:56px 20px;color:var(--muted)}
.sl-empty .sl-empty-icon{font-size:56px;line-height:1;margin-bottom:16px}
.sl-empty h3{font-size:19px;margin:0 0 8px;font-family:var(--display);color:var(--ink-2)}
.sl-lightbox{position:fixed;inset:0;z-index:200;background:rgba(14,27,43,.93);display:grid;place-items:center;padding:24px}
.sl-lightbox img{max-width:100%;max-height:90vh;border-radius:var(--r-s);object-fit:contain;box-shadow:var(--sh-2)}
.sl-lightbox-close{position:fixed;top:20px;inset-inline-end:24px;border:0;background:rgba(255,255,255,.15);
  color:#fff;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer;backdrop-filter:blur(6px)}
.saved{font-size:13px;color:var(--ok);font-family:var(--util);font-weight:700;opacity:0;transition:.3s}
.saved.on{opacity:1}
.moods{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}
.mood{border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r-s);padding:9px 15px;font-size:21px;
  line-height:1;transition:.15s}
.mood:hover{transform:translateY(-2px);border-color:var(--ink)}
.mood.on{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.06)}

/* ---------- רשימות וטבלאות ---------- */
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check input{width:21px;height:21px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto}
.check.done span{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:9px;margin-top:14px}
.addrow input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-s);padding:11px 14px;background:var(--paper)}
.addrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;padding:11px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--util);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;font-family:var(--util)}
.catbar{margin-bottom:14px}
.catbar .lbl{display:flex;justify-content:space-between;font-size:14px;font-family:var(--util);font-weight:700}
.catbar .track{height:8px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:6px}
.catbar .track i{display:block;height:100%;background:var(--accent)}

/* ---------- מזג אוויר וכסף ---------- */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:11px;margin-top:18px}
.wday{background:var(--wash);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 8px;text-align:center}
.wday .d{font-family:var(--util);font-size:11.5px;color:var(--muted);font-weight:700}
.wday .i{font-size:27px;margin:6px 0}
.wday .t{font-family:var(--util);font-weight:900;font-size:14px}
.wnow{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.wnow .big{font-family:var(--util);font-size:60px;font-weight:900;line-height:1;letter-spacing:-.04em;color:var(--accent)}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end}
.conv .swap{border:1.5px solid var(--line);background:var(--paper);border-radius:50%;width:46px;height:46px;font-size:18px;transition:.15s}
.conv .swap:hover{border-color:var(--accent);color:var(--accent);transform:rotate(180deg)}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
footer{padding:34px 0 48px;color:var(--muted);font-size:14px;text-align:center}
.saved-trip{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-s);padding:14px 18px;font-size:15px;margin-bottom:10px;
  box-shadow:var(--sh-1)}

/* ---------- מצב ילדים ---------- */
body.kids{background:#FFF6EF;background-image:radial-gradient(circle at 12% 8%,rgba(254,91,37,.16),transparent 46%),
  radial-gradient(circle at 88% 4%,rgba(24,144,255,.14),transparent 44%)}
.kidwrap{max-width:640px;margin:0 auto;padding:0 18px}
.kidtop{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:10px}
.kidtop .who{font-family:var(--display);font-size:21px}
.kidcard{background:#fff;border:2px solid var(--line);border-radius:30px;padding:28px 24px;margin-bottom:18px;
  box-shadow:var(--sh-2);text-align:center}
.kidcard .emoji{font-size:68px;line-height:1;margin-bottom:8px}
.kidcard h2{font-size:31px;margin:8px 0 12px}
.kidcard p{font-size:21px;line-height:1.55;margin:0;color:var(--ink-2)}
.kidbig{background:linear-gradient(145deg,#FF8A3D,var(--accent));border-color:transparent}
.kidbig h2,.kidbig p{color:#fff}
.kidteal{background:linear-gradient(145deg,var(--night-2),var(--night));border-color:transparent}
.kidteal h2,.kidteal p{color:#fff}
.speak{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:999px;padding:13px 26px;font-size:18px;
  font-weight:700;margin-top:16px;font-family:var(--util);backdrop-filter:blur(4px)}
.kidcard:not(.kidbig):not(.kidteal) .speak{background:var(--accent-soft);color:var(--accent-ink)}
.speak.talking{animation:pulse 1s infinite}
.mission{background:#fff;border:2px dashed var(--accent);border-radius:26px;padding:22px;margin-bottom:18px}
.mission h3{font-size:23px;color:var(--accent-ink);margin-bottom:12px;text-align:center}
.mission .task{display:flex;gap:14px;align-items:center;padding:13px;border-radius:16px;font-size:19px;transition:.15s}
.mission .task:active{background:var(--accent-soft)}
.mission .task .bx{width:38px;height:38px;border-radius:12px;border:2.5px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;background:#fff}
.mission .task.done .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.mission .task.done span{text-decoration:line-through;opacity:.5}
.stickers{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:14px;min-height:46px}
.stickers i{font-size:34px;font-style:normal;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.kidcount{font-family:var(--util);font-weight:900;font-size:80px;line-height:1;letter-spacing:-.05em}
.kidnav{display:flex;gap:10px;justify-content:center;margin:20px 0 48px;flex-wrap:wrap}
.kidnav button{border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 22px;font-size:17px;
  font-weight:700;font-family:var(--util);transition:.15s}
.kidnav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kidphoto{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.kidphoto img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;border:3px solid #fff;box-shadow:var(--sh-1)}
.kidpic{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;box-shadow:var(--sh-1);opacity:0;transition:.6s}
.kidpic.loaded{opacity:1}

@media (max-width:720px){
  .slot .time{font-size:17px}
  .slot-head{flex-wrap:wrap}
  .gal{grid-template-columns:1fr}
  .thumb{flex-basis:96px}
}
@media (max-width:640px){
  body{font-size:16px}
  .stage{min-height:auto;padding:26px 0 56px}
  .conv{grid-template-columns:1fr}
  .conv .swap{justify-self:center}
  .now-body,.box{padding:20px}
  .kidcard h2{font-size:27px}.kidcard p{font-size:19px}
  .stamp{flex-basis:60px}.stamp b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  nav.tabs,.toolbar,.quick,.topbar,button,.dayselect{display:none!important}
  .panel{display:block!important;page-break-before:always}
  body{background:#fff}.site-hero{background:#fff;color:#000}
  .site-hero h1,.tagline{color:#000}.hero-photo,.site-hero:before{display:none}
}

<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="scrim" data-close></div>
  <div class="panel-in"><header><h3>הגדרות</h3><button class="iconbtn" data-close aria-label="סגירה">${ICON.close}</button></header>
  <div class="body" id="sheetbody"></div></div></div>
<script>
/* ===================== יסודות ===================== */
const SELF_HTML='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EMBEDDED=!!window.__EMBEDDED_TRIP__;
const TRIP_PARAM=(()=>{ try{ return new URLSearchParams(location.search).get('trip')||''; }catch(e){ return ''; } })();
const GUEST=EMBEDDED||!!TRIP_PARAM;   // מי שנכנס לצפות בטיול, לא לבנות אחד
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const localGet=k=>{ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } };
const localSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } };
const localDel=k=>{ try{ localStorage.removeItem(k); }catch(e){} };

/* ===================== ענן ===================== */
function newTripId(){
  const a=new Uint8Array(9); (crypto.getRandomValues?crypto.getRandomValues(a):a.fill(0));
  return 't'+[...a].map(x=>x.toString(36)).join('').slice(0,14)+Date.now().toString(36).slice(-4);
}
function normSbUrl(u){
  let v=String(u||'').trim();
  if(!v) return '';
  if(!/^https?:\/\//i.test(v)) v='https://'+v.replace(/^\/+/,'');
  try{ return new URL(v).origin; }                    // מסיר /rest/v1, פרמטרים וסיומות
  catch(e){ return v.replace(/\/.*$/,'').replace(/\/+$/,''); }
}
const SB={ url:'', key:'', ok:false, shared:false,
  get on(){ return !!(this.url&&this.key&&this.ok); },
  h(x){ return Object.assign({apikey:this.key,Authorization:'Bearer '+this.key},x||{}); },
  async rest(path,opts={}){
    const o=Object.assign({},opts);
    o.headers=this.h(Object.assign({'Content-Type':'application/json'},opts.headers));
    const r=await fetch(normSbUrl(this.url)+'/rest/v1/'+path,o);
    if(!r.ok) throw new Error('שגיאת ענן '+r.status);
    const t=await r.text(); return t?JSON.parse(t):null;
  },
  async test(url,key){
    const clean=normSbUrl(url);
    if(!clean||!/^https:\/\/[^/]+$/i.test(clean)) return {ok:false,msg:'הכתובת צריכה להיראות כך: https://xxxx.supabase.co'};
    try{
      const r=await fetch(clean+'/rest/v1/rpc/trip_get',{method:'POST',
        headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json'},
        body:JSON.stringify({p_trip:'__ping__',p_key:'__ping__'})});
      if(r.status===401||r.status===403) return {ok:false,msg:'המפתח נדחה. ודאו שהעתקתם את המפתח המסומן anon public.'};
      if(r.status===404) return {ok:false,msg:'החיבור תקין אבל הטבלאות עוד לא נוצרו. הריצו את סקריפט ההקמה.'};
      if(!r.ok) return {ok:false,msg:'שגיאה '+r.status+' מהשרת.'};
      return {ok:true,msg:'מעולה, הענן מחובר. מעכשיו הכול נשמר ומשותף.'};
    }catch(e){ return {ok:false,msg:'לא הצלחנו להגיע לשרת. בדקו את הכתובת ואת החיבור לרשת.'}; }
  },
  async rpc(fn,args){
    return this.rest('rpc/'+fn,{method:'POST',body:JSON.stringify(args)});
  },
  async viaRpc(fn,args,fallback){
    if(this.rpcOff) return fallback();
    try{ return await this.rpc(fn,args); }
    catch(e){
      if(/ 40[04]| 42883/.test(e.message)||/404|Not Found/.test(e.message)){ this.rpcOff=true; return fallback(); }
      throw e;
    }
  },
  kv(trip,key,value){
    return this.viaRpc('trip_set',{p_trip:trip,p_key:key,p_value:value},()=>
      this.rest('trip_shared_data?on_conflict=trip_id,data_key',{method:'POST',
        headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({trip_id:trip,data_key:key,value,updated_at:new Date().toISOString()})}));
  },
  async kvGet(trip,key){
    return this.viaRpc('trip_get',{p_trip:trip,p_key:key},async()=>{
      const r=await this.rest(`trip_shared_data?trip_id=eq.${encodeURIComponent(trip)}&data_key=eq.${encodeURIComponent(key)}&select=value`);
      return (r&&r[0])?r[0].value:null;
    });
  },
  upsertEntry(trip,kind,day,payload){ return this.kv(trip,kind+(day?':'+day:''),payload); },
  getEntry(trip,kind,day){ return this.kvGet(trip,kind+(day?':'+day:'')); },
  saveTrip(t){ return this.kv(t.id,'plan',t); },
  getTrip(id){ return this.kvGet(id,'plan'); },
  async listTrips(){
    if(this.shared){                       // ענן משותף לכל המשתמשים: מציגים רק את הטיולים של המכשיר
      const mine=localGet('trips:index')||[];
      return mine;
    }
    const r=await this.rest('trip_shared_data?data_key=eq.plan&select=trip_id,value&order=updated_at.desc&limit=20');
    return (r||[]).map(x=>({id:x.trip_id,title:(x.value||{}).title||'',dest:(x.value||{}).dest||'',days:(x.value||{}).days||0}));
  },
  async photos(trip,day){
    const r=await this.viaRpc('story_list',{p_trip:trip,p_day:String(day)},()=>
      this.rest(`trip_stories?trip_id=eq.${encodeURIComponent(trip)}&day_key=eq.${day}&select=*&order=visit_date.asc`));
    return (r||[]).flatMap(row=>((row.images||[]).map((u,i)=>({id:row.id,url:u,path:(row.image_paths||[])[i]||'',
      place:row.location_name||'',uploaded_by:row.author||''}))));
  },
  async countPhotos(trip){
    if(this._count&&this._count.id===trip) return this._count.n;
    const n=await this.viaRpc('photo_count',{p_trip:trip},async()=>{
      const r=await this.rest(`trip_stories?trip_id=eq.${encodeURIComponent(trip)}&select=images`);
      return (r||[]).reduce((s,row)=>s+((row.images||[]).length||0),0);
    });
    this._count={id:trip,n:+n||0};
    return this._count.n;
  },
  bumpCount(trip,delta){ if(this._count&&this._count.id===trip) this._count.n=Math.max(0,this._count.n+delta); },
  async addPhoto(trip,day,blob,meta){
    const path=`${trip}/${day}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
    const up=await fetch(normSbUrl(this.url)+'/storage/v1/object/trip-story-images/'+path,
      {method:'POST',headers:this.h({'Content-Type':'image/jpeg','x-upsert':'true'}),body:blob});
    if(!up.ok) throw new Error('העלאת התמונה נכשלה');
    const url=normSbUrl(this.url)+'/storage/v1/object/public/trip-story-images/'+path;
    const row=await this.viaRpc('story_add',{p_trip:trip,p_day:String(day),p_day_title:meta.dayTitle||'',
        p_author:meta.by||'',p_place:meta.place||'',p_images:[url],p_paths:[path]},()=>

const AI={
  proxy: window.__AI_PROXY__||'',
  provider: localGet('ai:provider')||'auto',
  key: localGet('ai:key')||'',
  gkey: localGet('ai:gkey')||'',
  gmodel: localGet('ai:gmodel')||'gemini-3.6-flash',
  get hasKey(){ return !!(this.proxy||this.gkey||this.key); },
  get slow(){ return this.modes()[0]==='gemini'; },
  modes(){
    if(this.provider==='gemini') return this.gkey?['gemini']:[];
    if(this.provider==='anthropic') return this.key?['anthropic']:['host'];
    const m=[]; if(this.proxy)m.push('proxy'); if(this.gkey)m.push('gemini'); if(this.key)m.push('anthropic');
    m.push('host'); return m;
  },
  label(){
    if(this.provider==='manual') return 'הדבקה מהצ׳אט';
    return {gemini:'Gemini (חינם)',anthropic:'Claude',proxy:'שרת מתווך',host:'אוטומטי'}[this.modes()[0]]||'הדבקה מהצ׳אט';
  },
  async call(mode,prompt){
    if(mode==='gemini'){
      const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(this.gmodel)}:generateContent`;
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':this.gkey},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],
          generationConfig:{maxOutputTokens:4000,temperature:.8,responseMimeType:'application/json'}})});
      if(!r.ok) return {ok:false,status:r.status};
      const d=await r.json();
      const parts=(((d.candidates||[])[0]||{}).content||{}).parts||[];
      return {ok:true,status:200,text:parts.map(p=>p.text||'').join('')};
    }
    const body=JSON.stringify({model:"claude-sonnet-4-6",max_tokens:3000,messages:[{role:"user",content:prompt}]});
    let r;
    if(mode==='proxy') r=await fetch(this.proxy,{method:'POST',headers:{'Content-Type':'application/json'},body});
    else if(mode==='anthropic') r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':this.key,'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'},body});
    else r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body});
    if(!r.ok) return {ok:false,status:r.status};
    const d=await r.json();
    return {ok:true,status:200,text:(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n')};
  },
  async test(mode,val){
    const prev={key:this.key,gkey:this.gkey};
    if(mode==='gemini') this.gkey=val; else this.key=val;
    try{ const r=await this.call(mode,'Reply with {"ok":true}');
      if(r.ok) return {ok:true,msg:'מצוין, המפתח עובד.'};
      if(r.status===400) return {ok:false,msg:'המפתח או שם הדגם לא תקינים.'};
      if(r.status===401||r.status===403) return {ok:false,msg:'המפתח נדחה. ודאו שהעתקתם אותו במלואו.'};
      if(r.status===429) return {ok:false,msg:'חריגה ממכסת השימוש. נסו שוב בעוד דקה.'};
      if(r.status===404) return {ok:false,msg:'שם הדגם לא נמצא. נסו שם אחר.'};
      return {ok:false,msg:'שגיאה '+r.status+'.'};
    }catch(e){ return {ok:false,msg:'הדפדפן לא הצליח להגיע לשרת. אם פתחתם את הקובץ מהמחשב, העלו אותו לאינטרנט.'}; }
    finally{ this.key=prev.key; this.gkey=prev.gkey; }
  }
};
function parseJSON(txt){
  let t=String(txt).replace(/```json|```/g,'').trim();
  const s=t.indexOf('{'); if(s>0) t=t.slice(s);
  try{ return JSON.parse(t); }catch(e){}
  const cut=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(cut>0){ let c=t.slice(0,cut+1),o=[];
    for(const ch of c){ if(ch==='{'||ch==='[')o.push(ch); else if(ch==='}'||ch===']')o.pop(); }
    while(o.length) c+=o.pop()==='{'?'}':']';
    try{ return JSON.parse(c); }catch(e){} }
  throw new Error('התשובה לא בפורמט תקין');
}
async function ask(prompt){
  const modes=AI.modes();
  if(!modes.length) throw new Error('לא הוגדר מפתח.');
  let blocked=0,status=0;
  for(const mode of modes){
    for(let a=0;a<3;a++){
      let r;
      try{ r=await AI.call(mode,prompt); }catch(e){ blocked++; break; }
      if(r.ok) return r.text;
      status=r.status;
      if(r.status===429){ await wait(8000*(a+1)); continue; }
      break;
    }
    if(status===429) throw new Error('הגענו למכסת הבקשות. המתינו דקה ונסו שוב.');
    if(status===401||status===403) throw new Error('המפתח נדחה. בדקו אותו בהגדרות.');
    if(status===402) throw new Error('אין יתרה בחשבון המשויך למפתח.');
  }
  if(blocked&&!status) throw new Error('לא הצלחנו להגיע לשרת המודל.');
  throw new Error('הבקשה נדחתה (שגיאה '+status+').');
}

function wireSettings(){
  const on=(id,ev,fn)=>{ const el=$('#'+id); if(el) el[ev]=fn; };
  $('#aiprov').onchange=()=>{ AI.provider=$('#aiprov').value; localSet('ai:provider',AI.provider); };
  on('gtest','onclick',async()=>{ const k=$('#gkey').value.trim(); if(!k)return;
    AI.gmodel=$('#gmodel').value.trim()||'gemini-3.6-flash'; localSet('ai:gmodel',AI.gmodel);
    $('#gmsg').textContent='בודק…'; const r=await AI.test('gemini',k); $('#gmsg').textContent='';
    $('#gres').innerHTML=`<div class="${r.ok?'ok-box':'err-box'}">${esc(r.msg)}</div>`;
    if(r.ok){ AI.gkey=k; localSet('ai:gkey',k); } });
  on('gclear','onclick',()=>{ AI.gkey=''; localDel('ai:gkey'); $('#gkey').value=''; $('#gres').innerHTML=''; });
  on('aitest','onclick',async()=>{ const k=$('#aikey').value.trim(); if(!k)return;
    $('#aimsg').textContent='בודק…'; const r=await AI.test('anthropic',k); $('#aimsg').textContent='';
    $('#aires').innerHTML=`<div class="${r.ok?'ok-box':'err-box'}">${esc(r.msg)}</div>`;
    if(r.ok){ AI.key=k; localSet('ai:key',k); } });
  on('aiclear','onclick',()=>{ AI.key=''; localDel('ai:key'); $('#aikey').value=''; $('#aires').innerHTML=''; });
  on('copysql','onclick',async()=>{
    try{ await navigator.clipboard.writeText(SQL_SCRIPT); $('#sqlmsg').textContent='הועתק ✓'; }
    catch(e){ $('#sqlbox').style.display='block'; $('#sqlbox').textContent=SQL_SCRIPT; $('#sqlmsg').textContent='העתיקו מכאן'; }
    setTimeout(()=>{ const m=$('#sqlmsg'); if(m)m.textContent=''; },2500); });
  on('showsql','onclick',()=>{ const b=$('#sqlbox'); b.textContent=SQL_SCRIPT; b.style.display=b.style.display==='none'?'block':'none'; });
  on('sbtest','onclick',async()=>{ const url=$('#sburl').value.trim(),key=$('#sbkey').value.trim();
    $('#sbmsg').textContent='בודק…'; const r=await SB.test(url,key); $('#sbmsg').textContent='';
    $('#sbres').innerHTML=`<div class="${r.ok?'ok-box':'err-box'}">${esc(r.msg)}</div>`;
    if(r.ok){ SB.url=url; SB.key=key; SB.ok=true; localSet('sb:config',{url,key}); } });
  on('sbclear','onclick',()=>{ SB.url='';SB.key='';SB.ok=false; localDel('sb:config');
    $('#sburl').value=''; $('#sbkey').value=''; $('#sbres').innerHTML=''; });
}

async function renderHome(){
  const saved=(await store.get('trips:index'))||[];
  app.innerHTML=`${topbar()}
  <div class="wrap narrow">
    <div class="stage center">
      <p class="eyebrow">בונה אתרי טיול</p>
      <h2>לאן נוסעים?</h2>
      <p class="sub">תגידו לנו לאן, ונבנה לכם אתר טיול שלם — מסלול לפי שעות, ניווט, יומן תמונות, תרגום, תקציב ומצב מיוחד לילדים.</p>
      <input class="bigin" id="dest" placeholder="איטליה, יוון, תאילנד…" value="${esc(state.form.dest)}" autocomplete="off">
      <div class="chips" style="justify-content:center;margin-top:20px" id="destchips">
        ${['איטליה','יוון','ספרד','תאילנד','יפן','גאורגיה','קפריסין','דובאי'].map(d=>`<span class="chip" data-d="${d}">${d}</span>`).join('')}</div>
      <div style="margin-top:30px"><button class="btn btn-primary btn-lg" id="go">בואו נתחיל</button></div>
    </div>
    ${saved.length?`<div style="padding-bottom:60px"><p class="eyebrow" style="margin-bottom:12px">הטיולים שלכם</p>
      ${saved.map(t=>`<div class="saved-trip"><span><b>${esc(t.title)}</b><br><span class="hint">${esc(t.dest)} · ${t.days} ימים</span></span>
      <button class="btn btn-ghost btn-sm" data-open="${esc(t.id)}">פתיחה</button></div>`).join('')}</div>`:''}
    <footer>הכול נשמר אצלכם. אפשר לפרסם את האתר בלחיצה כשמסיימים.</footer>
  </div>`;
  wireTop();
  const go=()=>{ const v=$('#dest').value.trim(); if(!v){ $('#dest').focus(); return; }
    state.form.dest=v; state.step=1; renderStep(); };
  $('#go').onclick=go;
  $('#dest').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } };
  $('#destchips').onclick=e=>{ const d=e.target.dataset.d; if(!d)return; $('#dest').value=d; go(); };
  $$('[data-open]').forEach(b=>b.onclick=async()=>{
    const t=await store.get('tripdata:'+b.dataset.open);
    if(t){ state.trip=t; state.tab='now'; state.day=todayIndex(t)||1; renderSite(); } });
}

  {q:'מי נוסע?', sub:'זה משנה את כל אופי המסלול', render:()=>optGrid('who',[

  {q:'בני כמה הילדים?', sub:'כדי להתאים אטרקציות ומרחקי הליכה', when:()=>state.form.who==='משפחה עם ילדים'||state.form.who==='משפחה מורחבת',

      ['car','רכב שכור',''],['train','תחבורה ציבורית',''],['bus','טיול מאורגן',''],['mix','שילוב','']])},
  {q:'מה התקציב?', sub:'משפיע על המלצות האוכל והלינה', render:()=>optGrid('budget',[

        <textarea id="notes" rows="3" placeholder="למשל: יש עגלה, שומרי כשרות, סבתא לא הולכת הרבה, רוצים יום אחד בים">${esc(state.form.notes)}</textarea></div>

function activeSteps(){ return STEPS.filter(s=>!s.when||s.when()); }
function optGrid(key,opts){
  return `<div class="opts" data-opt="${key}">${opts.map(([ic,label,sub])=>`
    <button class="opt ${state.form[key]===label?'on':''}" data-v="${esc(label)}">
      <span class="ico">${ICON[ic]||''}</span><b>${esc(label)}</b>${sub?`<small>${esc(sub)}</small>`:''}</button>`).join('')}</div>`;
}
function renderStep(){
  const list=activeSteps(), i=state.step-1;
  if(i>=list.length) return renderReview();
  const st=list[i];
  app.innerHTML=`${topbar()}
  <div class="wrap narrow"><div class="stage center">
    <div class="dots">${list.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <h2>${esc(st.q)}</h2>${st.sub?`<p class="sub">${esc(st.sub)}</p>`:'<div style="height:14px"></div>'}
    ${st.render()}
    <div class="navrow">
      <button class="btn btn-plain" id="back">חזרה</button>
      <button class="btn btn-primary" id="next">${i===list.length-1?'סיימנו':'הבא'}</button></div>
  </div></div>`;
  wireTop();
  const grid=$('[data-opt]');
  if(grid) grid.onclick=e=>{ const b=e.target.closest('.opt'); if(!b)return;
    state.form[grid.dataset.opt]=b.dataset.v; $$('.opt',grid).forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); setTimeout(nextStep,180); };
  const kc=$('#kidchips');
  if(kc) kc.onclick=e=>{ const a=e.target.dataset.a; if(!a)return; e.target.classList.toggle('on');
    state.form.kids=$$('#kidchips .chip.on').map(c=>c.dataset.a).join(', '); };
  const ints=$('#ints');
  if(ints) ints.onclick=e=>{ const c=e.target.closest('.chip'); if(!c)return; c.classList.toggle('on');
    state.form.interests=$$('#ints .chip.on').map(x=>x.dataset.i); };
  const dv=$('#dval');
  if(dv) $$('.stepper button').forEach(b=>b.onclick=()=>{
    state.form.days=Math.max(1,Math.min(21,state.form.days+(+b.dataset.n)));
    dv.textContent=state.form.days; });
  $('#back').onclick=()=>{ state.step--; state.step<1?renderHome():renderStep(); };
  $('#next').onclick=nextStep;
  const cp=$('#coverpic');
  if(cp) cp.onchange=()=>{ const f=cp.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=e=>{ state.form.coverPhoto=e.target.result; }; r.readAsDataURL(f); };
}
function nextStep(){
  const st=activeSteps()[state.step-1];
  if(st&&st.q.startsWith('כמה ימים')){ const s=$('#start'); if(s) state.form.start=s.value; }
  if(st&&st.q.startsWith('יש ערים')){ const r=$('#route'); if(r) state.form.route=r.value.trim(); }
  if(st&&st.q.startsWith('עוד משהו')){ const n=$('#notes'),t=$('#title');
    if(n) state.form.notes=n.value; if(t) state.form.title=t.value; }
  state.step++; renderStep();
}
function renderReview(){
  const f=state.form;
  if(!f.title) f.title='הטיול שלנו ב'+f.dest;

function dateISO(i){ if(!state.form.start)return''; const d=new Date(state.form.start); d.setDate(d.getDate()+i); return d.toISOString().slice(0,10); }
function dateFor(i){ if(!state.form.start)return''; const d=new Date(state.form.start); d.setDate(d.getDate()+i);
  return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'}); }
function ctx(){ const f=state.form;
  return `יעד: ${f.dest}. הרכב: ${f.who}${f.kids?' (גילאי הילדים: '+f.kids+')':''}. ${f.days} ימים. קצב ${f.pace}. תקציב ${f.budget}. תחבורה: ${f.transport}. תחומי עניין: ${f.interests.join(', ')}.${f.route?' מסלול מבוקש: '+f.route+'.':''}${f.notes?' הערות: '+f.notes:''} הקהל ישראלי, כתוב בעברית טבעית וחמה.`; }
const hasKids=()=>/ילדים|מורחבת/.test(state.form.who);

const P={
  plan:()=>`אתה מתכנן טיולים מנוסה. ${ctx()}
${state.form.route?'חובה לכבד את המסלול המבוקש: '+state.form.route+'. ':''}בנה שלד מסלול הגיוני גאוגרפית, בלי קפיצות מיותרות בין אזורים.
מבנה: {"tagline":"משפט קולע","summary":"2 משפטים","practical":{"currency":"","currencyCode":"קוד ISO כמו EUR","language":"","langCode":"קוד שפה כמו it","plug":"","emergency":"","transport":"","weather":""},"skeleton":[{"day":1,"title":"שם היום","base":"עיר הלינה","focus":"במשפט"}]}
בדיוק ${state.form.days} ימים ב-skeleton.`,
  guide:sk=>`${ctx()} המסלול: ${sk.join(' · ')}.
מבנה: {"tips":[{"title":"","text":""}],"packing":[{"group":"","items":[""]}],"budgetPlan":[{"cat":"","estimate":"","note":""}]}
6 טיפים ספציפיים ליעד (לא כלליים), 4 קבוצות ציוד עם 6 פריטים מותאמים להרכב ולעונה, 5 שורות תקציב.`,
  lang:l=>`${ctx()} שפת היעד: ${l}.
מבנה: {"categories":[{"name":"","words":[{"he":"","local":"","translit":"תעתיק באותיות עבריות"}]}]}
5 קטגוריות: בסיסי, במסעדה, בדרכים, קניות, חירום. 5 מילים בכל אחת.`,
  extras:bases=>`${ctx()} בסיסי הלינה: ${bases}.
מבנה: {"lodging":[{"base":"","area":"אזור מומלץ ללינה","why":"עד 12 מילים","tip":"עד 10 מילים"}],"cams":[{"place":"אתר מפורסם","note":"עד 8 מילים"}]}
שורה לכל בסיס, ו-5 מקומות מוכרים שסביר שיש להם מצלמת לייב.`,
  day:(i,n,sk,prev)=>`${ctx()}
תכנן את יום ${i+1} מתוך ${n}. נושא: "${sk.title}". בסיס לינה: ${sk.base}. אתמול: ${prev}. ${dateFor(i)?'תאריך: '+dateFor(i)+'.':''}
מבנה: {"title":"","base":"","summary":"משפט","wake":"07:30","depart":"08:45","departNote":"עד 10 מילים","segments":[{"time":"09:15","title":"","place":"שם מדויק לניווט","desc":"עד 16 מילים","stay":"כמה זמן להישאר","travel":"זמן ואופן הנסיעה ליעד הבא","tip":"עד 10 מילים"}],"food":[{"name":"","type":"","note":""}],"evening":"משפט","backAt":"20:30"${hasKids()?`,"kid":{"emoji":"אימוג׳י אחד שמייצג את היום","simple":"משפט אחד לילד בן חמש, מילים קצרות ופשוטות","fact":"עובדה מפתיעה וכיפית לילד, עד 12 מילים","missions":["משימה כיפית לילד באותו יום, עד 7 מילים"]}`:''}}
4 עד 5 סגמנטים בשעות אמיתיות, מקומות שקיימים באמת ב${sk.base}. 2 המלצות אוכל.${hasKids()?' ב-missions שלוש משימות חיפוש כיפיות שילד יכול לעשות באותם מקומות.':''}`
};

async function build(){
  if(AI.provider==='manual') return startManual();
  if(!AI.hasKey){
    renderWorking('בודקים חיבור');
    if(!await probeProxy() && !await hostWorks()) return renderChooser();
  }
  const n=state.form.days;
  const steps=[{k:'plan',t:'מתכנן את המסלול הכללי'},{k:'guide',t:'אוסף טיפים, ציוד ותקציב'},
    {k:'lang',t:'מכין מילון בשפה המקומית'},{k:'extra',t:'מחפש לינה ומצלמות לייב'}]
    .concat([...Array(n)].map((_,i)=>({k:'d'+(i+1),t:`בונה את יום ${i+1}`})))
    .concat([{k:'save',t:'שומר הכול'}]);
  let done=0;
  app.innerHTML=`${topbar()}<div class="wrap"><div class="progress">
    <p class="eyebrow">בונים עבורכם</p>
    <h2 style="font-size:26px;margin:6px 0 2px">${esc(state.form.dest)} · ${n} ימים</h2>
    <p class="hint" style="margin:0">${esc(AI.label())} · זה לוקח כדקה</p>
    <div class="bar"><i id="bari" style="width:3%"></i></div>
    <ul class="steps" id="steps">${steps.map(s=>`<li id="st-${s.k}"><span class="dot"></span>${s.t}</li>`).join('')}</ul>
    <div id="berr"></div></div></div>`;
  wireTop();
  const mark=(k,c)=>{ const e=$('#st-'+k); if(e)e.className=c; };
  const tick=()=>{ done++; const b=$('#bari'); if(b) b.style.width=Math.round(done/steps.length*100)+'%'; };
  try{
    mark('plan','run');
    const plan=await askJSON(P.plan());
    mark('plan','done'); tick();
    const trip={id:newTripId(),form:{...state.form},title:state.form.title,dest:state.form.dest,
      days:n,start:state.form.start,kidsMode:hasKids(),tagline:plan.tagline||'',summary:plan.summary||'',
      practical:plan.practical||{},skeleton:plan.skeleton||[],guide:{},lang:{},extras:{},plan:[],
      coverPhoto:state.form.coverPhoto||''};

    mark('guide','run');
    try{ trip.guide=await askJSON(P.guide(trip.skeleton.map(s=>s.title))); mark('guide','done'); }
    catch(e){ mark('guide','err'); } tick();
    mark('lang','run');
    try{ trip.lang=await askJSON(P.lang(trip.practical.language||'')); mark('lang','done'); }
    catch(e){ mark('lang','err'); } tick();
    mark('extra','run');
    try{ trip.extras=await askJSON(P.extras([...new Set(trip.skeleton.map(s=>s.base))].join(', '))); mark('extra','done'); }
    catch(e){ mark('extra','err'); } tick();

    const makeDay=async i=>{
      const sk=trip.skeleton[i]||{title:'יום '+(i+1),base:state.form.dest};
      const prompt=P.day(i,n,sk,i>0?(trip.skeleton[i-1].base||''):'הנחיתה');
      let d;
      for(let attempt=0;attempt<2;attempt++){
        try{ d=await askJSON(prompt); if(d&&d.segments&&d.segments.length) break; }
        catch(e){ if(attempt===1) throw e; await wait(2000); }
      }
      if(!d||!d.segments) throw new Error('יום ריק');
      d.day=i+1; d.date=dateFor(i); d.iso=dateISO(i); return d; };
    const BATCH=AI.slow?2:3;
    for(let i=0;i<n;i+=BATCH){ const batch=[];
      for(let j=i;j<Math.min(i+BATCH,n);j++){ mark('d'+(j+1),'run');
        batch.push(makeDay(j).then(d=>{trip.plan[j]=d;mark('d'+(j+1),'done');tick();})
        .catch(()=>{trip.plan[j]=fallbackDay(trip,j);mark('d'+(j+1),'err');tick();})); }
      await Promise.all(batch);
      if(AI.slow&&i+BATCH<n) await wait(2500); }

    mark('save','run');
    state.trip=trip; state.day=todayIndex(trip)||1;
    await store.set('tripdata:'+trip.id,trip);
    { const idx=(localGet('trips:index')||[]).filter(x=>x.id!==trip.id);
      idx.unshift({id:trip.id,title:trip.title,dest:trip.dest,days:trip.days});
      localSet('trips:index',idx.slice(0,12)); }
    mark('save','done'); tick();
    renderSite();
  }catch(err){
    if(!AI.hasKey) return startManual('לא הצלחנו להגיע למודל מהאתר הזה, אז עברנו לדרך שלא דורשת מפתח — דרך הצ׳אט שלכם.');
    $('#berr').innerHTML=`<div class="err-box">${esc(err.message)}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btn-primary btn-sm" id="retry">ניסיון נוסף</button>
        <button class="btn btn-ghost btn-sm" id="tomanual">בנייה דרך הצ׳אט</button>
        <button class="btn btn-plain btn-sm" id="tohome">חזרה</button></div>`;
    const r=$('#retry'); if(r) r.onclick=build;
    const t=$('#tomanual'); if(t) t.onclick=()=>startManual();
    const h=$('#tohome'); if(h) h.onclick=renderHome;
  }
}
function fallbackDay(trip,j){
  const sk=trip.skeleton[j]||{};
  return {day:j+1,title:sk.title||'יום '+(j+1),base:sk.base||'',date:dateFor(j),iso:dateISO(j),
    summary:sk.focus||'',segments:[],food:[],failed:true};
}

/* ===================== בנייה דרך הצ'אט ===================== */
/* הכול בהנחיה אחת. אם התשובה נקטעת, מבקשים "המשך" ומדביקים שוב — אותה שיחה. */
function fullPrompt(){
  const n=state.form.days;
  return `${ctx()}
בנה לי תוכנית טיול מלאה. ענה אך ורק ב-JSON תקין, בלי טקסט לפני או אחרי ובלי סימני קוד.
היה תמציתי: בלי רווחים מיותרים, בלי שורות ריקות, ערכים קצרים.

מבנה:
{"tagline":"משפט קולע","summary":"2 משפטים",
"practical":{"currency":"","currencyCode":"קוד ISO","language":"","langCode":"קוד שפה","plug":"","emergency":"","transport":"","weather":""},
"guide":{"tips":[{"title":"","text":""}],"packing":[{"group":"","items":[""]}],"budgetPlan":[{"cat":"","estimate":"","note":""}]},
"lang":{"categories":[{"name":"","words":[{"he":"","local":"","translit":"תעתיק עברי"}]}]},
"extras":{"lodging":[{"base":"","area":"","why":"","tip":""}],"cams":[{"place":"","note":""}]},
"days":[{"day":1,"title":"","base":"עיר הלינה","summary":"משפט","wake":"07:30","depart":"08:45","departNote":"עד 8 מילים","segments":[{"time":"09:15","title":"","place":"שם מדויק לניווט","desc":"עד 14 מילים","stay":"כמה זמן","travel":"זמן ואופן הנסיעה הלאה","tip":"עד 8 מילים"}],"food":[{"name":"","type":"","note":""}],"evening":"משפט","backAt":"20:30"${hasKids()?`,"kid":{"emoji":"","simple":"משפט לילד בן חמש","fact":"עובדה כיפית","missions":["משימה קצרה","משימה קצרה","משימה קצרה"]}`:''}}]}

דרישות: בדיוק ${n} ימים במערך days, ממוספרים 1 עד ${n}${state.form.route?', חייב לכבד את המסלול: '+state.form.route:''}.
לכל יום 4 עד 5 סגמנטים בשעות אמיתיות ומקומות שקיימים באמת. 2 המלצות אוכל ליום.
6 טיפים ליעד, 4 קבוצות ציוד עם 6 פריטים, 5 שורות תקציב, 5 קטגוריות מילון עם 5 מילים בכל אחת.
אם אתה מתקרב למגבלת אורך — אל תקצר ימים, פשוט עצור באמצע ואני אבקש המשך.`;
}
function contPrompt(missing){
  const from=missing[0], to=missing[missing.length-1];
  return `המשך את התשובה הקודמת. החזר JSON תקין בלבד עם המפתח days בלבד, לימים ${from} עד ${to}, באותו מבנה מדויק:
{"days":[{"day":${from},"title":"","base":"","summary":"","wake":"","depart":"","departNote":"","segments":[{"time":"","title":"","place":"","desc":"","stay":"","travel":"","tip":""}],"food":[{"name":"","type":"","note":""}],"evening":"","backAt":""${hasKids()?',"kid":{"emoji":"","simple":"","fact":"","missions":[""]}':''}}]}
בלי טקסט נוסף ובלי סימני קוד.`;
}
function mergeAnswer(j,t){
  if(!j||typeof j!=='object') return;
  if(j.tagline) t.tagline=j.tagline;
  if(j.summary) t.summary=j.summary;
  if(j.practical) t.practical=j.practical;
  if(j.guide) t.guide=j.guide;
  if(j.lang) t.lang=j.lang;
  if(j.extras) t.extras=j.extras;
  const days=j.days||(j.day?[j]:null);
  (days||[]).forEach(d=>{
    const idx=(+d.day||0)-1;
    if(idx<0||idx>=t.days) return;
    if(!d.segments||!d.segments.length) return;      // יום חלקי מהקטיעה — מתעלמים
    d.date=dateFor(idx); d.iso=dateISO(idx); d.day=idx+1;
    t.plan[idx]=d;
  });
}
function missingDays(t){
  const out=[];
  for(let i=0;i<t.days;i++) if(!t.plan[i]||!(t.plan[i].segments||[]).length) out.push(i+1);
  return out;
}
function startManual(note){
  state.manual={ note:note||'', chunks:0,
    trip:{id:newTripId(),form:{...state.form},title:state.form.title||('הטיול שלנו ב'+state.form.dest),
      dest:state.form.dest,days:state.form.days,start:state.form.start,kidsMode:hasKids(),
      tagline:'',summary:'',practical:{},skeleton:[],guide:{},lang:{},extras:{},plan:[]} };
  renderManual();
}
function renderManual(err){
  const m=state.manual, t=m.trip;
  const missing=missingDays(t);
  const started=m.chunks>0;
  const prompt=started&&missing.length?contPrompt(missing):fullPrompt();
  const done=t.days-missing.length;
  const pct=Math.round(done/t.days*100);
  app.innerHTML=`${topbar()}<div class="wrap narrow"><div class="progress" style="max-width:100%">
    <p class="eyebrow">בנייה דרך הצ'אט</p>

function todayIndex(t){ const s=t.start||(t.form||{}).start; if(!s)return 0;
  const a=new Date(s);a.setHours(0,0,0,0); const b=new Date();b.setHours(0,0,0,0);
  const i=Math.round((b-a)/864e5); return (i>=0&&i<t.days)?i+1:0; }
function daysTo(t){ const s=t.start||(t.form||{}).start; if(!s)return null;
  const a=new Date(s);a.setHours(0,0,0,0); const b=new Date();b.setHours(0,0,0,0); return Math.round((a-b)/864e5); }
const mapsUrl=(q,d)=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+', '+d);
const wazeUrl=(q,d)=>'https://waze.com/ul?q='+encodeURIComponent(q+', '+d)+'&navigate=yes';
const mins=t=>{ const m=/^(\d{1,2}):(\d{2})/.exec(String(t)||''); return m?+m[1]*60+ +m[2]:null; };
const WMO={0:['☀️','בהיר'],1:['🌤️','בהיר בעיקר'],2:['⛅','מעונן חלקית'],3:['☁️','מעונן'],45:['🌫️','ערפל'],48:['🌫️','ערפל'],
 51:['🌦️','טפטוף'],53:['🌦️','טפטוף'],55:['🌦️','טפטוף חזק'],61:['🌧️','גשם קל'],63:['🌧️','גשם'],65:['🌧️','גשם חזק'],
 71:['🌨️','שלג קל'],73:['🌨️','שלג'],75:['❄️','שלג כבד'],80:['🌦️','ממטרים'],81:['🌧️','ממטרים'],82:['⛈️','ממטרים עזים'],95:['⛈️','רעמים'],96:['⛈️','רעמים'],99:['⛈️','רעמים']};
async function fetchWeather(place){
  const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=he&name='+encodeURIComponent(place)).then(r=>r.json());
  const loc=(g.results||[])[0]; if(!loc) throw new Error('לא נמצא מיקום');
  const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,apparent_temperature&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`).then(r=>r.json());
  return {loc,w};
}
async function fetchRate(from,to){
  try{ const r=await fetch(`https://api.frankfurter.app/latest?from=${from}&to=${to}`).then(r=>r.json());
    if(r&&r.rates&&r.rates[to]) return {rate:r.rates[to],date:r.date,src:'ECB'}; }catch(e){}
  try{ const r=await fetch(`https://open.er-api.com/v6/latest/${from}`).then(r=>r.json());
    if(r&&r.rates&&r.rates[to]) return {rate:r.rates[to],date:(r.time_last_update_utc||'').slice(0,16),src:'open.er-api'}; }catch(e){}
  return null;
}
function shrink(file){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const m=1400,s=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?res(b):rej(new Error('דחיסת התמונה נכשלה')),'image/jpeg',.72); };
    img.onerror=()=>rej(new Error('קובץ תמונה לא תקין')); img.src=r.result; };
  r.onerror=()=>rej(new Error('קריאת הקובץ נכשלה')); r.readAsDataURL(file); }); }
const blobToDataURL=b=>new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); });

const Photos={
  mem:{},
  cacheKey:'photo:',
  wiki:'https://he.wikipedia.org/w/api.php',
  async find(name,ctx){
    if(!name) return null;
    const k=(name+'|'+(ctx||'')).slice(0,80);
    if(this.mem[k]!==undefined) return this.mem[k];
    const cached=localGet(this.cacheKey+k);
    if(cached!==null&&cached!==undefined){ this.mem[k]=cached; return cached; }
    let url=null;
    for(const host of ['he.wikipedia.org','en.wikipedia.org','commons.wikimedia.org']){
      try{
        const q=encodeURIComponent(name+(ctx&&host!=='commons.wikimedia.org'?' '+ctx:''));
        const api=`https://${host}/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrlimit=1&gsrnamespace=${host.includes('commons')?6:0}&prop=pageimages&piprop=original|thumbnail&pithumbsize=1200&format=json&origin=*`;
        const r=await fetch(api);
        if(!r.ok) continue;
        const j=await r.json();
        const pages=((j.query||{}).pages)||{};
        for(const id in pages){
          const p=pages[id];
          const src=(p.original&&p.original.source)||(p.thumbnail&&p.thumbnail.source);
          if(src){ url=src; break; }
        }
        if(url) break;
      }catch(e){}
    }
    this.mem[k]=url; localSet(this.cacheKey+k,url);
    return url;
  },
  /* ממלא תמונות ברקע לתוך אלמנטים עם data-photo */
  hydrate(root=document){
    $$('[data-photo]',root).forEach(async el=>{
      if(el.dataset.done) return; el.dataset.done='1';
      const url=await this.find(el.dataset.photo,el.dataset.photoCtx||'');
      if(!url){ el.classList.add('nophoto'); return; }
      if(el.tagName==='IMG'){ el.src=url; el.classList.add('loaded'); }
      else { el.style.backgroundImage=`url("${url}")`; el.classList.add('loaded'); }
    });
  }
};

  ((t.extras||{}).gallery||[]).forEach(g=>{ if(g&&g.name&&!seen[g.name]){ seen[g.name]=1; out.push({name:g.name,sub:g.subtitle||''}); } });
  (t.plan||[]).forEach(d=>{
    (d.segments||[]).forEach(sg=>{ const n=sg.place||sg.title;

async function wireJournal(){
  const t=state.trip;
  window._flush=null;
  let slView='place', slSearch='';
  let allCloud=[]; // flat list of all photos (cloud mode)
  let allLocal={}; // {day: {photos:[...]}} (local mode)
  const sv=$('#jsaved'),up=$('#jup'),content=$('#sl-content'),quota=$('#jquota');
  const addRow=$('#sl-addrow'),by=$('#jby'),pl=$('#jplace'),pl2=$('#jplace2'),dayPick=$('#jday');
  if(!content) return;
  by.value=localGet('me:'+t.id)||'';
  const limited=SB.on&&SB.shared;
  let used=0;

  // --- Load all days ---
  if(SB.on){
    try{
      for(let d=1;d<=t.plan.length;d++){
        const rows=await SB.photos(t.id,d);
        allCloud=allCloud.concat(rows.map(r=>({...r,_day:d})));
      }
    }catch(e){ up.textContent='לא הצלחנו לטעון תמונות'; }
  } else {
    for(let d=1;d<=t.plan.length;d++){
      const key='journal:'+t.id+':'+d;
      const data=await store.get(key)||{};
      if(data.photos&&data.photos.length) allLocal[d]=data;
    }
  }

  const getAll=()=>{
    if(SB.on) return allCloud;
    return Object.entries(allLocal).flatMap(([d,data])=>(data.photos||[]).map(p=>({...p,_day:+d})));
  };

  const removeCloudPhoto=async(photo)=>{
    try{ await SB.delPhoto(photo); allCloud=allCloud.filter(p=>p!==photo); used=Math.max(0,used-1); }
    catch(e){ up.textContent='המחיקה נכשלה'; }
  };
  const removeLocalPhoto=async(photo)=>{
    const d=photo._day||1, key='journal:'+t.id+':'+d;
    const data=allLocal[d]||{photos:[]};
    data.photos=data.photos.filter(p=>p!==photo);
    allLocal[d]=data;
    await store.set(key,data);
  };

  const openLightbox=src=>{
    const lb=document.createElement('div'); lb.className='sl-lightbox';
    lb.innerHTML=`<button class="sl-lightbox-close">✕</button><img src="${src}">`;
    lb.onclick=e=>{ if(e.target===lb||e.target.classList.contains('sl-lightbox-close')) lb.remove(); };
    document.body.appendChild(lb);
  };

  const paint=()=>{
    let photos=getAll();
    if(slSearch){ const q=slSearch.toLowerCase();
      photos=photos.filter(p=>(p.place||'').toLowerCase().includes(q)||(p.uploaded_by||p.by||'').toLowerCase().includes(q)); }
    if(!photos.length){
      content.innerHTML=`<div class="sl-empty"><div class="sl-empty-icon">📷</div>
        <h3>אין תמונות עדיין</h3>
        <p class="hint">לחצו "הוסף תמונות" כדי להתחיל את ה-Story Line</p></div>`;
      return;
    }
    const groupFn=slView==='place'
      ?p=>(p.place||'ללא מקום')
      :p=>'יום '+(p._day||p.day||'?');
    const groups=new Map();
    photos.forEach(p=>{ const k=groupFn(p); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(p); });
    content.innerHTML=[...groups.entries()].map(([label,plist])=>{
      const byUsers=[...new Set(plist.map(p=>p.uploaded_by||p.by||''))].filter(Boolean);
      const days=[...new Set(plist.map(p=>p._day||p.day).filter(Boolean))].sort((a,b)=>a-b);
      const meta=slView==='place'?days.map(d=>'יום '+d).join(', ')+' · '+plist.length+' תמונות'
        :plist.length+' תמונות';
      const icon=slView==='place'?'📍':String(days[0]||'').padStart(2,'0');
      const iconStyle=slView==='time'?'background:var(--night);color:#fff;font-size:13px;font-weight:900;font-family:var(--util)':'';
      return `<div class="sl-group">
        <div class="sl-group-head">
          <div class="sl-loc-icon" style="${iconStyle}">${icon}</div>
          <div><h3>${esc(label)}</h3><span class="sl-group-meta">${meta}</span></div>
        </div>
        <div class="sl-grid">${plist.map((p,i)=>`<div class="sl-photo" data-idx="${i}" data-label="${esc(label)}">
          <img src="${p.url||p.src}" alt="" loading="lazy">
          <button class="rm" data-idx="${i}" data-label="${esc(label)}">✕</button>
        </div>`).join('')}</div>
        ${byUsers.length?`<div class="sl-entry-meta">
          ${byUsers.map(u=>`<span class="sl-badge">${esc(u)}</span>`).join('')}
          <span class="sl-entry-date">${days.length?'יום '+days[0]:''}</span>
        </div>`:''}
      </div>`;
    }).join('');
    // wire clicks
    content.querySelectorAll('.sl-photo').forEach(el=>{
      el.onclick=e=>{ if(e.target.classList.contains('rm')) return;
        const label=el.dataset.label, idx=+el.dataset.idx;
        const p=[...groups.get(label)||[]][idx];
        if(p) openLightbox(p.url||p.src); };
    });
    content.querySelectorAll('.rm').forEach(btn=>{
      btn.onclick=async e=>{ e.stopPropagation();
        const label=btn.dataset.label, idx=+btn.dataset.idx;
        const plist=groups.get(label)||[];
        const photo=plist[idx]; if(!photo) return;
        if(SB.on) await removeCloudPhoto(photo); else await removeLocalPhoto(photo);
        refreshQuota(); paint(); };
    });
  };

  const refreshQuota=async()=>{
    if(!limited){ quota.textContent=''; return; }
    try{ used=await SB.countPhotos(t.id); }catch(e){ return; }
    const left=Math.max(0,PHOTO_LIMIT-used);
    quota.innerHTML=`<div style="display:flex;justify-content:space-between;font-family:var(--util);font-size:13px">
      <span>${used} מתוך ${PHOTO_LIMIT} תמונות</span><span>${left?'נשארו '+left:'הגעתם למכסה'}</span></div>
      <div style="height:6px;background:var(--wash);border-radius:99px;overflow:hidden;margin-top:5px;border:1px solid var(--line)">
        <i style="display:block;height:100%;width:${Math.min(100,Math.round(used/PHOTO_LIMIT*100))}%;
           background:${left?'var(--accent)':'#C0392B'};transition:width .4s"></i></div>
      ${left?'':'<p class="hint" style="margin:6px 0 0">מחקו תמונות כדי להוסיף עוד.</p>'}`;
    const busy=left===0;
    [$('#jgal'),$('#jcam')].forEach(el=>{ if(el){ el.disabled=busy; el.closest('label').style.opacity=busy?.5:1; } });
  };

  const flashSaved=()=>{ sv.classList.add('on'); setTimeout(()=>sv.classList.remove('on'),1500); };

  const addFiles=async files=>{
    const place=pl.value==='__other'?(pl2.value||''):pl.value;
    const who=by.value; localSet('me:'+t.id,who);
    const day=+(dayPick.value||1);
    let arr=[...files].slice(0,8);
    if(limited){
      const left=Math.max(0,PHOTO_LIMIT-used);
      if(left===0){ up.textContent='הגעתם למכסה.'; return; }
      if(arr.length>left){ arr=arr.slice(0,left); }
    }
    for(let i=0;i<arr.length;i++){ up.textContent=`מעלה ${i+1} מתוך ${arr.length}…`;
      try{ const blob=await shrink(arr[i]);
        if(SB.on){
          const row=await SB.addPhoto(t.id,day,blob,{place,by:who,dayTitle:(t.plan[day-1]||{}).title||''});
          if(row){ allCloud.push({...row,_day:day}); used++; }
        } else {
          const key='journal:'+t.id+':'+day;
          const data=allLocal[day]||(allLocal[day]={photos:[]});
          data.photos=(data.photos||[]).concat({src:await blobToDataURL(blob),place,by:who,_day:day}).slice(0,20);
          await store.set(key,data);
        }
      }catch(e){ up.textContent=e.message; }
      paint();
    }
    up.textContent=''; flashSaved(); refreshQuota();
    addRow.classList.remove('open');
  };

  $$('.sl-tab').forEach(btn=>btn.onclick=()=>{

  });
  $('#slsearch').oninput=e=>{ slSearch=e.target.value; paint(); };
  // add row toggle
  $('#sl-add-btn').onclick=()=>addRow.classList.toggle('open');

  pl.onchange=()=>{ pl2.style.display=pl.value==='__other'?'block':'none'; };
  by.onchange=()=>localSet('me:'+t.id,by.value);
  if($('#jgal')) $('#jgal').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };
  if($('#jcam')) $('#jcam').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };

  paint(); refreshQuota();
}

async function wireTools(){
  const t=state.trip,code=((t.practical||{}).currencyCode||'EUR').toUpperCase();
  const ils=$('#cils'),loc=$('#cloc'),note=$('#crate'); let rate=null;
  const r=await fetchRate('ILS',code);
  if(r){ rate=r.rate; note.textContent=`1 ₪ = ${r.rate.toFixed(4)} ${code} · עודכן ${r.date}`; }
  else { note.innerHTML=`לא נטען שער. הזינו ידנית: <input id="mrate" type="number" step="0.0001" style="width:110px;border:1.5px solid var(--line);border-radius:8px;padding:4px 8px"> ${code} לשקל`;
    const mi=$('#mrate'); if(mi) mi.oninput=()=>{ rate=+mi.value||null; }; }
  const calc=s=>{ if(!rate)return;
    if(s==='ils') loc.value=ils.value?(+ils.value*rate).toFixed(2):'';
    else ils.value=loc.value?(+loc.value/rate).toFixed(2):''; };
  ils.oninput=()=>calc('ils'); loc.oninput=()=>calc('loc');
  $('#cquick').onclick=e=>{ const v=e.target.dataset.v; if(!v)return; ils.value=v; calc('ils'); };
  $('#cswap').onclick=()=>{ const a=ils.value; ils.value=loc.value; loc.value=a; calc('ils'); };
  const paintW=async place=>{ const box=$('#wbox'); if(!box)return; box.textContent='טוען…';
    try{ const {loc:L,w}=await fetchWeather(place); const c=w.current,ic=WMO[c.weather_code]||['🌡️',''];
      box.innerHTML=`<div class="wnow"><div class="big">${Math.round(c.temperature_2m)}°</div>
        <div><div style="font-size:26px">${ic[0]} ${ic[1]}</div>
        <div class="hint">מרגיש כמו ${Math.round(c.apparent_temperature)}° · לחות ${c.relative_humidity_2m}% · רוח ${Math.round(c.wind_speed_10m)} קמ"ש · ${esc(L.name)}</div></div></div>
        <div class="wgrid">${w.daily.time.map((dd,i)=>{ const k=WMO[w.daily.weather_code[i]]||['🌡️',''];
          return `<div class="wday"><div class="d">${new Date(dd).toLocaleDateString('he-IL',{weekday:'short'})}</div>
          <div class="i">${k[0]}</div><div class="t">${Math.round(w.daily.temperature_2m_max[i])}° / ${Math.round(w.daily.temperature_2m_min[i])}°</div>
          <div class="d">${w.daily.precipitation_probability_max[i]??0}% גשם</div></div>`; }).join('')}</div>`;
    }catch(e){ box.innerHTML='<div class="err-box">לא הצלחנו למשוך מזג אוויר כרגע.</div>'; } };
  paintW((t.plan[state.day-1]||t.plan[0]||{}).base||t.dest);
  $$('[data-city]').forEach(b=>b.onclick=()=>{ $$('[data-city]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); paintW(b.dataset.city); });
}

async function wirePack(){
  const t=state.trip,key='pack:'+t.id; const data=(await store.get(key))||{checked:{},extra:{}};
  data.checked=data.checked||{}; data.extra=data.extra||{};
  Object.keys(data.extra).forEach(gi=>{ const box=$('#grp-'+gi); if(!box)return;
    (data.extra[gi]||[]).forEach((it,ei)=>box.insertAdjacentHTML('beforeend',
      `<label class="check"><input type="checkbox" data-p="x${gi}:${ei}"><span>${esc(it)}</span></label>`)); });

    const s=$('#packstat'); if(s) s.textContent=`${on.length} מתוך ${all.length} ארוזים`; };
  $$('[data-p]').forEach(cb=>{ cb.checked=!!data.checked[cb.dataset.p];
    cb.closest('.check').classList.toggle('done',cb.checked);
    cb.onchange=async()=>{ data.checked[cb.dataset.p]=cb.checked; cb.closest('.check').classList.toggle('done',cb.checked);

    data.extra[gi]=(data.extra[gi]||[]).concat(v); await store.set(key,data); inp.value=''; renderSite(); });

}
